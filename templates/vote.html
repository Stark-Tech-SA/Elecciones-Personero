{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Hola, {{ student.full_name }}</h2>
  <p>Selecciona tu candidato a Personero.</p>
  <form method="post">
    <h3>Personero</h3>
    <div style="display:grid; grid-template-columns: repeat(auto-fit,minmax(320px,1fr)); gap:14px; margin-bottom:18px;">
      {% for c in candidates_by_position['Personero'] %}
        <label style="border:1px solid #ddd; border-radius:10px; padding:12px; display:block; cursor:pointer; background:#fff;">
          <input type="radio" name="personero" value="{{ c.id }}" required>
          <h3 style="margin:.4rem 0 .7rem; text-align:center; font-size:1.45rem;">{{ c.full_name }}</h3>
          <p class="muted" style="margin:0 0 .5rem; text-align:center;">Grado: {{ c.grade or '-' }}</p>
          {% if c.photo_path %}
            <img src="/{{ c.photo_path }}" alt="foto" style="width:min(100%, 420px); aspect-ratio:1 / 1; object-fit:cover; border-radius:8px; margin:0 auto .6rem; display:block;">
          {% endif %}
          <p style="margin:0;"><strong>Propuesta:</strong> {{ c.proposal or 'Sin propuesta registrada.' }}</p>
        </label>
      {% else %}
        <p>No hay candidatos a Personero registrados.</p>
      {% endfor %}
    </div>

    <button type="submit">Registrar voto</button>
  </form>
</div>
{% endblock %}
